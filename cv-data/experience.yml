# Employers -> roles -> achievements.
# Add new achievements freely; tags let you filter them for a specific CV.
# Optional per achievement: metrics (numbers/results), tech (tools used), notes (private).
#
# You do NOT need to write polished text. A minimal new entry is just rough facts:
#   - id: my-new-thing
#     title: Short label
#     facts:                       # messy notes are fine: what, why, result, tools
#       - moved 40 repos from GitLab, kept history
#       - saved the team ~2h/week
#     tags: [github, migrations]
# `text` is the ready-to-use wording. When it is empty, Copilot (or the future
# render script) writes it from `facts` when you build a CV.
# The website shows every achievement that has `text`. Set `site: false` on an
# achievement to keep it in this knowledge base only.
employers:
  - id: softwareone
    company: SoftwareOne
    location:
    roles:
      - title: Cloud Native Developer
        start: 2022-07   # promoted from Junior; set exact date if wanted
        end: present
        achievements:
          - id: github-governance
            title: GitHub governance
            text: >-
              Designing how client organizations run on GitHub Enterprise: who
              can access what, how branches are protected, and which security
              policies apply. The goal is a setup that keeps teams productive
              and code safe.
            tags: [github, governance, security]
          - id: github-copilot
            title: GitHub Copilot
            text: >-
              Helping teams roll out Copilot and make it part of how they work,
              so developers get the benefit with the right guardrails in place.
            tags: [github, copilot, ai]
          - id: agentic-engineering
            title: Agentic engineering and custom agents
            text: >-
              Building custom Copilot agents, instructions, skills, MCP
              integrations and agentic workflows that speed up everyday work
              and keep the team consistent: documentation, issue triage and an
              internal agent plugin that supports offerings and sales needs
              for clients.
            facts:
              - Built custom agents and agentic workflows to speed up team processes and keep results consistent across the team.
              - Use cases include documentation, issue triage and an internal agent plugin for offerings and sales work for client needs.
              - Used custom agents, instruction and skill files, MCP servers and GitHub Actions with Copilot / agentic workflows.
            tags: [copilot, ai, agentic, automation, github, mcp]
            tech: [GitHub Copilot, custom agents, MCP, GitHub Actions]
          - id: migrations
            title: Migrations
            text: >-
              Moved more than 1,000 repositories to GitHub for multiple
              clients from sources such as Azure DevOps, GitLab and SVN, with
              no data lost along the way. Where off-the-shelf tools fell short,
              custom migration and sync tooling filled the gap.
            tags: [github, migrations, tooling]
            metrics: ["1,000+ repositories migrated", zero data lost]
            tech: [Azure DevOps, GitLab, SVN]
          - id: cicd
            title: CI/CD
            text: >-
              Replacing aging build and release pipelines with GitHub Actions
              workflows that are simpler to maintain and give clients quicker,
              more dependable releases.
            tags: [github-actions, cicd, devops]
          - id: reusable-actions-runners
            title: Reusable workflows, actions and runners
            text: >-
              Building reusable workflows and actions that cover build, test
              and deploy for clients moving to GitHub, tuning existing
              workflows along the way, and setting up GitHub-hosted and
              self-hosted runners to run them.
            facts:
              - Built reusable workflows and actions (several kinds, including reusable workflows and composite actions) for various clients while migrating them to GitHub.
              - Covered the full build, test and deploy lifecycle.
              - Optimized existing workflows as part of client migrations to GitHub.
              - Set up GitHub-hosted and self-hosted GitHub Actions runners for clients.
            tags: [github-actions, cicd, devops, runners, migrations]
            tech: [GitHub Actions, self-hosted runners]
          - id: jenkins-jcasc-azure-migration
            title: Jenkins migration to Azure with JCasC
            text: >-
              Migrated a custom on-prem Jenkins to Azure with nearly 900
              pipelines and no downtime. The whole setup is managed as code
              with JCasC and promoted from dev to test to prod, with backup
              options in place on prod.
            facts:
              - Migrated a custom on-prem Jenkins to an Azure-hosted Jenkins.
              - Managed the whole Jenkins configuration as code with Jenkins Configuration as Code (JCasC).
              - Promoted changes through dev, test and prod environments from the JCasC code.
              - Set up backup options for the prod Jenkins.
              - Migrated close to 900 pipelines with no downtime, at SoftwareOne.
            metrics: [nearly 900 pipelines migrated, zero downtime]
            tags: [jenkins, jcasc, azure, cicd, devops, migrations]
            tech: [Jenkins, JCasC, Azure]
          - id: automation
            title: Automation
            text: >-
              Automating the repetitive work around delivery: IssueOps
              workflows for access requests and release coordination, and
              PowerShell automation that makes Azure deployments repeatable.
            tags: [automation, issueops, powershell, azure]
          - id: community
            title: Community
            text: >-
              An active, friendly voice in the internal engineering
              community: always happy to help colleagues, answer questions,
              review code and share what has been learned.
            tags: [community, mentoring]

